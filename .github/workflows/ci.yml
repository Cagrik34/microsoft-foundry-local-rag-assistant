name: Zenith AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Backend Tests & Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio fastapi uvicorn pydantic numpy requests
      - name: Lint with flake8
        run: |
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Test Suite
        run: |
          python -m pytest tests/test_evaluation_benchmark.py -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Typecheck and Build Bundle
        working-directory: ./frontend
        run: npm run build